[package]
name = "pleaseask"
version = "0.1.0"
edition = "2024"
description = "A teacher-operated Iroh chat for classroom questions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.52", default-features = false, features = ["sync"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hex = "0.4"
js-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
